name: Auto Update Worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点运行
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置环境
        run: |
          echo "REPO_URL=https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases" >> $GITHUB_ENV
          echo "TARGET_FILE=worker.js" >> $GITHUB_ENV

      - name: 检查并更新 Worker
        id: update_worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 日志函数
          log() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"; }

          log "开始检查更新..."

          # 获取本地版本
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          log "本地版本: ${LOCAL_VERSION:-无}"

          # 获取最新 Release
          log "获取最新 Release 信息..."
          RESPONSE=$(curl -s --retry 3 -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "$REPO_URL")
          if [ $? -ne 0 ] || [ -z "$RESPONSE" ]; then
            log "ERROR: 无法访问 GitHub API"
            exit 1
          fi

          TAG_NAME=$(echo "$RESPONSE" | jq -r '.[0].tag_name')
          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.[0].assets[] | select(.name == "'"$TARGET_FILE"'") | .browser_download_url')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            log "ERROR: 未找到 $TARGET_FILE"
            exit 1
          fi
          log "最新版本: $TAG_NAME"

          # 下载到临时文件后比较实际内容
          # 即使 version.txt 已经是最新版本，也能发现 _worker.js 与官方 worker.js 不一致
          log "下载 $TARGET_FILE..."
          wget -q -O "/tmp/worker.js" "$DOWNLOAD_URL"

          if [ ! -s "/tmp/worker.js" ]; then
            log "ERROR: worker.js 下载失败或文件为空"
            exit 1
          fi

          LOCAL_SHA256=$(sha256sum "_worker.js" 2>/dev/null | awk '{print $1}')
          REMOTE_SHA256=$(sha256sum "/tmp/worker.js" | awk '{print $1}')

          log "本地 _worker.js SHA256: ${LOCAL_SHA256:-无}"
          log "官方 worker.js SHA256: $REMOTE_SHA256"

          # 版本相同且文件内容也相同，才真正跳过更新
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$LOCAL_SHA256" = "$REMOTE_SHA256" ] && [ "$FORCE_UPDATE" != "true" ]; then
            log "版本和文件内容均为最新，无需更新"
            echo "UPDATED=false" >> $GITHUB_ENV
            exit 0
          fi

          # 官方 worker.js → Cloudflare Pages 实际部署文件 _worker.js
          cp "/tmp/worker.js" "_worker.js"

          if [ ! -s "_worker.js" ]; then
            log "ERROR: _worker.js 更新失败"
            exit 1
          fi

          # 清理旧的 worker.js，避免仓库同时保留两个 Worker 文件
          rm -f "$TARGET_FILE"
          rm -f "/tmp/worker.js"

          echo "$TAG_NAME" > version.txt
          log "更新完成：$TAG_NAME，已覆盖 _worker.js"

          echo "UPDATED=true" >> $GITHUB_ENV
          echo "FINAL_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: 提交更改
        if: env.UPDATED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步 Worker 版本: ${{ env.FINAL_TAG }}"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
